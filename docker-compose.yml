version: '3.8'

services:
  talentbridge-mysql:
    image: mysql:8.0.36
    container_name: talentbridge_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: talentbridge_db
    ports:
      - "3306:3306"
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --default-authentication-plugin=mysql_native_password
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talentbridge_net

  talentbridge-redis:
    image: redis:7.2-alpine
    container_name: talentbridge_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - talentbridge_net

  talentbridge-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talentbridge_app
    restart: unless-stopped
    depends_on:
      talentbridge-mysql:
        condition: service_healthy
      talentbridge-redis:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://talentbridge-mysql:3306/talentbridge_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_DATA_REDIS_HOST: talentbridge-redis
      SPRING_DATA_REDIS_PORT: 6379
      TALENTBRIDGE_JWT_SECRET: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    networks:
      - talentbridge_net

networks:
  talentbridge_net:
    driver: bridge

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
