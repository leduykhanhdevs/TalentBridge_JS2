server:
  port: ${PORT:8080}
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

spring:
  application:
    name: TalentBridge
  profiles:
    active: "${SPRING_PROFILES_ACTIVE:local}"
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  h2:
    console:
      enabled: false
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss
  mail:
    host: "${MAIL_HOST:smtp.gmail.com}"
    port: "${MAIL_PORT:587}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

talentbridge:
  jwt:
    secret: "${JWT_SECRET}"
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  cors:
    allowed-origins: "${CORS_ALLOWED_ORIGINS:http://localhost:5173}"
  password-reset:
    token-expiration-minutes: "${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:15}"
    reset-password-url: "${FRONTEND_RESET_PASSWORD_URL:http://localhost:5173/reset-password}"
    mail-enabled: "${PASSWORD_RESET_MAIL_ENABLED:false}"
    mail-from: "${MAIL_FROM:no-reply@talentbridge.vn}"
  rate-limit:
    enabled: "${RATE_LIMIT_ENABLED:true}"
    auth-limit: "${AUTH_RATE_LIMIT:10}"
    window-seconds: "${RATE_LIMIT_WINDOW_SECONDS:60}"
  upload:
    dir: "${UPLOAD_DIR:uploads}"
  admin-bootstrap:
    enabled: "${ADMIN_BOOTSTRAP_ENABLED:false}"
    email: "${ADMIN_BOOTSTRAP_EMAIL:}"
    password: "${ADMIN_BOOTSTRAP_PASSWORD:}"
    full-name: "${ADMIN_BOOTSTRAP_FULL_NAME:TalentBridge Administrator}"
  gemini:
    api-key: "${GEMINI_API_KEY:}"
    model: "${GEMINI_MODEL:gemini-3.5-flash-lite}"
    api-base-url: "${GEMINI_API_BASE_URL:https://generativelanguage.googleapis.com/v1beta}"
    connect-timeout-ms: "${GEMINI_CONNECT_TIMEOUT_MS:5000}"
    read-timeout-ms: "${GEMINI_READ_TIMEOUT_MS:20000}"

---
spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:h2:file:./data/talentbridge_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: false
  h2:
    console:
      enabled: true
      path: /h2-console

talentbridge:
  jwt:
    secret: "${JWT_SECRET:dGVzdC1zZWNyZXQta2V5LWZvci10YWxlbnRicmlkZ2UtdGVzdGluZy0xMjM0NTY3ODkwMTIzNDU2Nzg5MDEyMzQ1Njc4OTA=}"

---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: "${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/talentbridge_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}"
    username: "${SPRING_DATASOURCE_USERNAME:root}"
    password: "${SPRING_DATASOURCE_PASSWORD:}"
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: "${SPRING_DATASOURCE_URL}"
    username: "${SPRING_DATASOURCE_USERNAME}"
    password: "${SPRING_DATASOURCE_PASSWORD}"
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      minimum-idle: 1
      maximum-pool-size: "${DB_POOL_MAX_SIZE:5}"
      connection-timeout: 10000
      validation-timeout: 5000
      max-lifetime: 300000
      keepalive-time: 180000
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
  flyway:
    enabled: true
    baseline-on-migrate: true

