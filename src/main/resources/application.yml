server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: TalentBridge
  datasource:
    url: jdbc:mysql://localhost:3306/talentbridge_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: root
    password: ""
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    time-zone: Asia/Ho_Chi_Minh
    date-format: yyyy-MM-dd HH:mm:ss
  mail:
    host: "${MAIL_HOST:smtp.gmail.com}"
    port: "${MAIL_PORT:587}"
    username: "${MAIL_USERNAME:}"
    password: "${MAIL_PASSWORD:}"
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method

talentbridge:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
    refresh-expiration-ms: 604800000 # 7 days
  password-reset:
    token-expiration-minutes: "${PASSWORD_RESET_TOKEN_EXPIRATION_MINUTES:15}"
    reset-password-url: "${FRONTEND_RESET_PASSWORD_URL:http://localhost:3000/reset-password}"
    mail-enabled: "${PASSWORD_RESET_MAIL_ENABLED:false}"
    mail-from: "${MAIL_FROM:no-reply@talentbridge.vn}"
