# ==============================================================================
# TalentBridge Infrastructure as Code - Render Blueprint (render.yaml)
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Spring Boot 3 + Java 21 Container)
  # ----------------------------------------------------------------------------
  - type: web
    name: talentbridge-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: TALENTBRIDGE_JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        sync: false # Điền URL MySQL Cloud (VD: Aiven / Clever Cloud)
      - key: SPRING_DATASOURCE_USERNAME
        sync: false # Điền username MySQL
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false # Điền password MySQL
      - key: GEMINI_API_KEY
        sync: false # Điền Gemini API Key
      - key: CORS_ALLOWED_ORIGINS
        sync: false # Điền URL của Frontend Render (VD: https://talentbridge-frontend.onrender.com)
      - key: RATE_LIMIT_ENABLED
        value: "true"

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (React 19 + Vite SPA)
  # ----------------------------------------------------------------------------
  - type: web
    name: talentbridge-frontend
    runtime: static
    plan: free
    region: singapore
    autoDeploy: false
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Điền URL Backend Render kèm /api/v1 (VD: https://talentbridge-backend.onrender.com/api/v1)
