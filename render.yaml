# ==============================================================================
# TalentBridge Infrastructure as Code - Render Blueprint (render.yaml)
# ==============================================================================
services:
  # ----------------------------------------------------------------------------
  # 1. Backend Web Service (Spring Boot 3 + Java 21 Container)
  # ----------------------------------------------------------------------------
  - type: web
    name: talentbridge-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: singapore
    autoDeployTrigger: checksPass
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: TALENTBRIDGE_JWT_SECRET
        generateValue: true
      - key: SPRING_DATASOURCE_URL
        sync: false # JDBC URL MySQL Cloud; khi chuyển RDS dùng sslMode=VERIFY_IDENTITY và truststore trong Docker image
      - key: SPRING_DATASOURCE_USERNAME
        sync: false # Tài khoản ứng dụng DB, không dùng master account RDS
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false # Secret DB chỉ lưu trong Render Environment
      - key: SPRING_FLYWAY_USER
        sync: false # Optional migration account; defaults to datasource account when unset
      - key: SPRING_FLYWAY_PASSWORD
        sync: false # Optional migration secret; defaults to datasource password when unset
      - key: GEMINI_API_KEY
        sync: false # Điền Gemini API Key
      - key: CONTACT_VERIFICATION_EMAIL_ENABLED
        sync: false # Bật sau khi đã cấu hình relay và test email thật
      - key: CONTACT_VERIFICATION_MAIL_PROVIDER
        value: apps-script # Render Free chặn outbound SMTP; paid plan có thể chuyển sang smtp
      - key: GOOGLE_APPS_SCRIPT_URL
        sync: false # Apps Script web-app URL kết thúc bằng /exec
      - key: GOOGLE_APPS_SCRIPT_SECRET
        sync: false # Secret chỉ lưu trong Render Environment và Apps Script properties
      - key: ZALO_ZBS_ACCESS_TOKEN
        sync: false # Token của OA/App có quyền gửi tin theo SĐT
      - key: ZALO_ZBS_OTP_TEMPLATE_ID
        sync: false # ID template OTP đã được Zalo duyệt
      - key: ZALO_ZBS_OTP_FIELD
        sync: false # Tên trường OTP chính xác trong template được duyệt
      - key: CORS_ALLOWED_ORIGINS
        sync: false # Điền URL của Frontend Render (VD: https://talentbridge-frontend.onrender.com)
      - key: RATE_LIMIT_ENABLED
        value: "true"

  # ----------------------------------------------------------------------------
  # 2. Frontend Static Site (React 19 + Vite SPA)
  # ----------------------------------------------------------------------------
  - type: web
    name: talentbridge-frontend
    runtime: static
    autoDeployTrigger: checksPass
    buildCommand: cd frontend && npm install && VITE_RENDER_GIT_COMMIT="${RENDER_GIT_COMMIT:-unknown}" npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        sync: false # Điền URL Backend Render kèm /api/v1 (VD: https://talentbridge-backend.onrender.com/api/v1)
