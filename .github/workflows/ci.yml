name: TalentBridge Continuous Integration (CI)

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ dev ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-verify:
    name: Backend Build & Verify (Spring Boot 3 + JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Run Backend Verification Suite
        env:
          JWT_SECRET: "CiCdPipelineSecretKeyForTalentBridgeTestingMustBe32CharsLong!"
        run: ./mvnw -B verify

  frontend-verify:
    name: Frontend Test, Lint & Build (React 19 + Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Run Vitest Unit Tests
        run: pnpm test

      - name: Build Production Bundle (Type-check + Vite)
        run: pnpm build

  docker-verify:
    name: Dockerfile Build Verification
    runs-on: ubuntu-latest
    needs: [backend-verify]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: talentbridge-app:ci-check
