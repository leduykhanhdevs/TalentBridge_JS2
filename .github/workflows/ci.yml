name: TalentBridge CI/CD Pipeline

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  backend:
    name: Backend Build & Verify (Spring Boot 3 + JDK 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Grant Execute Permission for Maven Wrapper
        run: chmod +x mvnw

      - name: Run Backend Verification Suite
        env:
          JWT_SECRET: "CiCdPipelineSecretKeyForTalentBridgeTestingMustBe32CharsLong!"
        run: ./mvnw -B verify

  frontend:
    name: Frontend Test, Lint & Build (React 19 + Node 20)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 21 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run ESLint
        run: pnpm lint

      - name: Build Backend for E2E Tests
        run: |
          cd ..
          sh ./mvnw -B -DskipTests package

      - name: Run Vitest Suite
        env:
          JWT_SECRET: "CiCdPipelineSecretKeyForTalentBridgeTestingMustBe32CharsLong!"
          RATE_LIMIT_ENABLED: 'false'
          SPRING_PROFILES_ACTIVE: local
        run: |
          cd ..
          java -jar target/talentbridge-0.0.1-SNAPSHOT.jar > backend.log 2>&1 &
          backend_pid=$!
          trap 'kill "$backend_pid" 2>/dev/null || true' EXIT
          for attempt in {1..60}; do
            if curl --fail --silent --output /dev/null --max-time 2 \
              --header 'Content-Type: application/json' \
              --data '{"email":"admin@talentbridge.vn","password":"AdminPassword123!"}' \
              http://localhost:8080/api/v1/auth/login; then
              cd frontend
              pnpm test
              exit $?
            fi
            if ! kill -0 "$backend_pid" 2>/dev/null; then
              cat backend.log
              exit 1
            fi
            sleep 2
          done
          cat backend.log
          echo "Backend did not become ready"
          exit 1

      - name: Build Production Assets
        run: pnpm build
